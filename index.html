<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Gold jewelry films</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root { --ivory:#f6f0e6; --ink:#2b211a; --soft:#7a6857; --gold:#a8803f; --line:#e2d6c4; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--ivory); color: var(--ink); font-family: "Jost", system-ui, sans-serif; font-weight: 300; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 24px; }
  header { padding: 80px 0 48px; text-align: center; }
  h1 { font-family: "Cormorant Garamond", serif; font-weight: 400; font-size: clamp(40px, 6vw, 68px); margin: 0; letter-spacing: -.01em; }
  h1 em { font-style: italic; }
  .sub { margin-top: 14px; font-size: 13px; letter-spacing: .3em; text-transform: uppercase; color: var(--gold); }
  section { padding: 0 0 72px; }
  .head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
  h2 { font-family: "Cormorant Garamond", serif; font-weight: 500; font-size: 32px; letter-spacing: .2em; margin: 0; }
  .meta { font-size: 13px; letter-spacing: .18em; text-transform: uppercase; color: var(--soft); }
  .player { background: #0d0a08; border-radius: 4px; overflow: hidden; box-shadow: 0 24px 60px -32px rgba(43,33,26,.55); }
  .player.tall { max-width: 420px; margin: 0 auto; }
  video { display: block; width: 100%; height: auto; object-fit: contain; background: #0d0a08; }
  video:fullscreen, video:-webkit-full-screen { object-fit: contain; width: 100%; height: 100%; max-width: none; max-height: none; border-radius: 0; }
  .refs { border-top: 1px solid var(--line); padding-top: 56px; }
  .refs h2 { font-size: 26px; letter-spacing: .16em; text-align: center; margin-bottom: 28px; }
  .refs img { display: block; width: 100%; height: auto; border-radius: 3px; margin: 0 auto 14px; }
  .refs img.narrow { max-width: 720px; }
  @media (max-width: 700px) { header { padding: 52px 0 36px; } section { padding-bottom: 52px; } h2 { font-size: 26px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Gold <em>jewelry</em> films</h1>
    <div class="sub">Photoreal AI · spec films for fictional brands</div>
  </header>

  <section>
    <div class="head"><h2>VERELLE</h2><div class="meta">Herringbone collar · Hoops · 16:9</div></div>
    <div class="player">
      <video controls playsinline preload="metadata" poster="media/verelle-poster.jpg"><source src="media/verelle-v1.mp4" type="video/mp4"></video>
    </div>
  </section>

  <section>
    <div class="head"><h2>HALDEN</h2><div class="meta">Cuban chain · Bracelet · Signet · 16:9</div></div>
    <div class="player">
      <video controls playsinline preload="metadata" poster="media/halden-poster.jpg"><source src="media/halden-v1.mp4" type="video/mp4"></video>
    </div>
  </section>

  <section>
    <div class="head"><h2>OSSIA</h2><div class="meta">Hoops · Bangles · Rings · Rope chain · 9:16</div></div>
    <div class="player tall">
      <video controls playsinline preload="metadata" poster="media/ossia-poster.jpg"><source src="media/ossia-v1.mp4" type="video/mp4"></video>
    </div>
  </section>

  <section class="refs">
    <h2>Product reference → film</h2>
    <img src="media/verelle-detail.jpg" alt="Verelle necklace reference beside two film frames" loading="lazy">
    <img src="media/halden-detail.jpg" alt="Halden chain, bracelet and ring reference beside two film frames" loading="lazy">
    <img class="narrow" src="media/ossia-detail.jpg" alt="Ossia hoops, bangles and rings reference beside two film frames" loading="lazy">
  </section>
</div>
</body>
</html>
